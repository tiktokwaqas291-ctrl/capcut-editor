name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp ./*.html www/index.html
          npx cap init "CapCut Editor" com.capcut.editor --web-dir www
          npx cap add android

      - name: Add gallery save plugin
        run: |
          PKG_DIR=android/app/src/main/java/com/capcut/editor
          mkdir -p "$PKG_DIR"
          cp ./GallerySaverPlugin*.java "$PKG_DIR/GallerySaverPlugin.java"
          cat > "$PKG_DIR/MainActivity.java" <<'EOF'
          package com.capcut.editor;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(GallerySaverPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: capcut-editor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
