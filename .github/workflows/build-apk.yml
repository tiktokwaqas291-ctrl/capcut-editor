name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp ./*.html www/index.html
          npx cap init "CapCut Editor" com.capcut.editor --web-dir www
          npx cap add android

      - name: Add gallery save plugin
        run: |
          PKG_DIR=android/app/src/main/java/com/capcut/editor
          mkdir -p "$PKG_DIR"
          cat > "$PKG_DIR/MainActivity.java" <<'EOF'
          package com.capcut.editor;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(GallerySaverPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat > "$PKG_DIR/GallerySaverPlugin.java" <<'EOF'
          package com.capcut.editor;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "GallerySaver")
          public class GallerySaverPlugin extends Plugin {

              private File tmp;
              private FileOutputStream out;

              @PluginMethod
              public void begin(PluginCall call) {
                  try {
                      if (out != null) {
                          try { out.close(); } catch (Exception ignored) {}
                      }
                      tmp = new File(getContext().getCacheDir(), "export.tmp");
                      out = new FileOutputStream(tmp, false);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("begin failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void append(PluginCall call) {
                  try {
                      if (out == null) {
                          call.reject("begin() was not called");
                          return;
                      }
                      String data = call.getString("data", "");
                      if (data != null && !data.isEmpty()) {
                          out.write(Base64.decode(data, Base64.DEFAULT));
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("append failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void finish(PluginCall call) {
                  try {
                      if (out == null || tmp == null) {
                          call.reject("begin() was not called");
                          return;
                      }
                      out.flush();
                      out.close();
                      out = null;

                      String name = call.getString("name", "video.mp4");
                      String mime = call.getString("mime", "video/mp4");
                      boolean isVideo = mime.startsWith("video");

                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                          call.reject("Android 10 or newer is required to save to the gallery");
                          return;
                      }

                      String folder = (isVideo ? Environment.DIRECTORY_MOVIES : Environment.DIRECTORY_PICTURES) + "/CapCutEditor";
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, folder);
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                      Uri collection = isVideo
                              ? MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                              : MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);

                      ContentResolver resolver = getContext().getContentResolver();
                      Uri item = resolver.insert(collection, values);
                      if (item == null) {
                          call.reject("Could not create gallery entry");
                          return;
                      }

                      try (InputStream in = new FileInputStream(tmp);
                           OutputStream os = resolver.openOutputStream(item)) {
                          if (os == null) throw new Exception("Could not open gallery file");
                          byte[] buf = new byte[256 * 1024];
                          int n;
                          while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                      } catch (Exception e) {
                          resolver.delete(item, null, null);
                          throw e;
                      }

                      ContentValues done = new ContentValues();
                      done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      resolver.update(item, done, null, null);
                      tmp.delete();

                      call.resolve();
                  } catch (Exception e) {
                      call.reject("finish failed: " + e.getMessage());
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: capcut-editor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
